<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Secure Chat (OAuth2)</title>
    <link rel="icon" href="https://kakaomames.github.io/rei/logo.png">
    <meta name="theme-color" content="#1a73e8">
    
    <!-- 💡 メタタグをいっぱい盛り込み！ -->
    <meta name="description" content="Gemini Secure Chat with OAuth2 Client">
    <meta name="author" content="カカオマメ">
    <meta property="og:title" content="Gemini Secure Chat">
    <meta property="og:description" content="OAuth2 authenticated Gemini chat client via GAS.">
    <meta property="og:image" content="https://kakaomames.github.io/rei/logo.png">
    <meta name="twitter:card" content="summary">

    <!-- Google Identity Services (GIS) のスクリプト -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        :root {
            --bg-color: #131314;
            --chat-bg: #1e1f20;
            --text-color: #e3e3e3;
            --accent-color: #8ab4f8;
            --user-bubble: #004a77;
            --bot-bubble: #2d2e30;
        }
        body {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color); color: var(--text-color);
            display: flex; flex-direction: column; height: 100vh;
        }
        header {
            padding: 16px; background-color: var(--chat-bg);
            border-bottom: 1px solid #333;
            display: flex; justify-content: space-between; align-items: center;
        }
        header h1 { margin: 0; font-size: 1.2rem; display: flex; align-items: center; gap: 10px; }
        header img { width: 24px; height: 24px; border-radius: 50%; }
        .login-btn {
            background: #fff; color: #000; border: none; padding: 8px 16px;
            border-radius: 4px; font-weight: bold; cursor: pointer;
        }
        .login-btn:disabled {
            background: #555; color: #aaa; cursor: not-allowed;
        }
        #chat-container {
            flex: 1; overflow-y: auto; padding: 20px;
            display: flex; flex-direction: column; gap: 16px;
            max-width: 800px; width: 100%; margin: 0 auto; box-sizing: border-box;
        }
        .message { padding: 12px 16px; border-radius: 12px; max-width: 80%; line-height: 1.5; word-break: break-word; white-space: pre-wrap; }
        .message.user { background-color: var(--user-bubble); align-self: flex-end; border-bottom-right-radius: 2px; }
        .message.bot { background-color: var(--bot-bubble); align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid #3c4043; }
        .input-container { padding: 16px; background-color: var(--chat-bg); border-top: 1px solid #333; display: flex; justify-content: center; }
        .input-box { display: flex; max-width: 800px; width: 100%; background: #2a2b2c; border-radius: 24px; padding: 8px 16px; border: 1px solid #444; }
        .input-box textarea { flex: 1; background: transparent; border: none; color: white; resize: none; outline: none; font-size: 1rem; max-height: 150px; padding: 6px 0; }
        .input-box button { background: var(--accent-color); border: none; color: #000; font-weight: bold; padding: 6px 16px; border-radius: 16px; cursor: pointer; align-self: flex-end; }
        .input-box button:disabled { background: #555; color: #888; cursor: not-allowed; }
    </style>
</head>
<body>

    <header>
        <h1><img src="https://kakaomames.github.io/rei/logo.png" alt="Logo"> Gemini Client (OAuth2)</h1>
        <!-- 💡 ログインボタン -->
        <button id="login-btn" class="login-btn">Googleログイン</button>
    </header>

    <div id="chat-container">
        <div id="status-msg" class="message bot">まずは右上のボタンからGoogleログインを行ってください。</div>
    </div>

    <div class="input-container">
        <div class="input-box">
            <textarea id="user-input" rows="1" placeholder="メッセージを入力..." disabled></textarea>
            <button id="send-btn" disabled>送信</button>
        </div>
    </div>

    <script>
        // 💡 ご自身のGASのウェブアプリのURLに書き換えてね
        const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/YOUR_GAS_DEPLOY_ID/exec';
        
        // 💡 Google Cloud Consoleで発行した「クライアントID」をここに貼り付けます
        const GOOGLE_CLIENT_ID = 'YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com';

        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const loginBtn = document.getElementById('login-btn');
        const statusMsg = document.getElementById('status-msg');

        let chatHistory = [];
        let oauthToken = null; // 💡 取得したアクセストークンを保持する変数
        let tokenClient;

        // GISの初期化
        window.onload = function () {
            if (typeof google !== 'undefined' && google.accounts) {
                tokenClient = google.accounts.oauth2.initTokenClient({
                    client_id: GOOGLE_CLIENT_ID,
                    scope: 'https://www.googleapis.com/auth/cloud-platform', // 必要に応じてスコープ調整
                    callback: (tokenResponse) => {
                        if (tokenResponse && tokenResponse.access_token) {
                            oauthToken = tokenResponse.access_token;
                            loginBtn.innerText = "ログイン済み";
                            loginBtn.disabled = true;
                            userInput.disabled = false;
                            sendBtn.disabled = false;
                            statusMsg.textContent = "ログインに成功しました！メッセージをどうぞ。🤖✨";
                        }
                    },
                });
            } else {
                statusMsg.textContent = "Google認証ライブラリの読み込みに失敗しました。";
            }
        };

        // ログインボタンのクリックイベント
        loginBtn.addEventListener('click', () => {
            if (tokenClient) {
                tokenClient.requestAccessToken();
            } else {
                alert("認証クライアントが初期化されていません。");
            }
        });

        function appendMessage(sender, text) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            msgDiv.textContent = text;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function handleSend() {
            const text = userInput.value.trim();
            if (!text || !oauthToken) return;

            appendMessage('user', text);
            userInput.value = '';
            userInput.style.height = 'auto';

            chatHistory.push({ role: "user", parts: [{ text: text }] });

            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message bot';
            loadingDiv.textContent = '思考中... 🧭';
            chatContainer.appendChild(loadingDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const response = await fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'text/plain',
                        // 💡 取得したOAuth2トークンをヘッダーに載せてGASに送る
                        'Authorization': 'Bearer ' + oauthToken
                    },
                    body: JSON.stringify({ contents: chatHistory })
                });

                const data = await response.json();
                chatContainer.removeChild(loadingDiv);

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const reply = data.candidates[0].content.parts[0].text;
                    appendMessage('bot', reply);
                    chatHistory.push({ role: "model", parts: [{ text: reply }] });
                } else {
                    appendMessage('bot', 'エラー: ' + JSON.stringify(data));
                    chatHistory.pop();
                }
            } catch (err) {
                chatContainer.removeChild(loadingDiv);
                appendMessage('bot', '通信エラー: ' + err.message);
                chatHistory.pop();
            }
        }

        sendBtn.addEventListener('click', handleSend);
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); }
        });
        userInput.addEventListener('input', function() {
            this.style.height = 'auto'; this.style.height = (this.scrollHeight) + 'px';
        });
    </script>
</body>
</html>
