<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- 基本的なSEOメタタグ -->
    <title>Gemini Web Chat</title>
    <meta name="description" content="GASをプロキシにしたセキュアな軽量Geminiチャットクライアント">
    <meta name="keywords" content="Gemini, AI, チャット, GAS, WebClient, カカオマメ">
    <meta name="author" content="カカオマメ">
    
    <!-- OGP (Open Graph Protocol) - SNS等でのシェア用設定 -->
    <meta property="og:title" content="Gemini Web Chat">
    <meta property="og:description" content="GASをプロキシにしたセキュアな軽量Geminiチャットクライアント">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://kakaomames.github.io/rei/">
    <meta property="og:image" content="https://kakaomames.github.io/rei/logo.png">
    <meta property="og:site_name" content="Gemini programming隊">
    
    <!-- Twitterカード設定 -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Gemini Web Chat">
    <meta name="twitter:description" content="GASをプロキシにしたセキュアな軽量Geminiチャットクライアント">
    <meta name="twitter:image" content="https://kakaomames.github.io/rei/logo.png">
    
    <!-- UI/UX関連のメタタグ -->
    <meta name="theme-color" content="#1a73e8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Gemini Chat">

    <!-- アイコン -->
    <link rel="icon" href="https://kakaomames.github.io/rei/logo.png">
    <link rel="apple-touch-icon" href="https://kakaomames.github.io/rei/logo.png">

    <style>
        :root {
            --bg-color: #131314; --chat-bg: #1e1f20; --text-color: #e3e3e3;
            --accent-color: #8ab4f8; --user-bubble: #004a77; --bot-bubble: #2d2e30;
        }
        body {
            margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color); color: var(--text-color);
            display: flex; flex-direction: column; height: 100vh;
        }
        header {
            padding: 16px; background-color: var(--chat-bg); border-bottom: 1px solid #333;
            display: flex; justify-content: space-between; align-items: center;
        }
        header h1 { margin: 0; font-size: 1.2rem; display: flex; align-items: center; gap: 10px; }
        header img { width: 24px; height: 24px; }
        .logout-btn {
            background: transparent; color: #ff6b6b; border: 1px solid #ff6b6b;
            padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.85rem;
        }
        #chat-container {
            flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column;
            gap: 16px; max-width: 800px; width: 100%; margin: 0 auto; box-sizing: border-box;
        }
        .message { padding: 12px 16px; border-radius: 12px; max-width: 80%; line-height: 1.5; word-break: break-word; white-space: pre-wrap; }
        .message.user { background-color: var(--user-bubble); align-self: flex-end; border-bottom-right-radius: 2px; }
        .message.bot { background-color: var(--bot-bubble); align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid #3c4043; }
        .input-container { padding: 16px; background-color: var(--chat-bg); border-top: 1px solid #333; display: flex; justify-content: center; }
        .input-box { display: flex; max-width: 800px; width: 100%; background: #2a2b2c; border-radius: 24px; padding: 8px 16px; border: 1px solid #444; }
        .input-box textarea { flex: 1; background: transparent; border: none; color: white; resize: none; outline: none; font-size: 1rem; max-height: 150px; padding: 6px 0; }
        .input-box button { background: var(--accent-color); border: none; color: #000; font-weight: bold; padding: 6px 16px; border-radius: 16px; cursor: pointer; align-self: flex-end; }
    </style>
</head>
<body>

    <header>
        <h1><img src="https://kakaomames.github.io/rei/logo.png" alt="Logo"> Gemini Web Client</h1>
        <button id="logout-btn" class="logout-btn">ログアウト</button>
    </header>

    <div id="chat-container">
        <div class="message bot">こんにちは！メッセージを入力して送信してください（ドライブ記憶・OAuth2対応）。</div>
    </div>

    <div class="input-container">
        <div class="input-box">
            <textarea id="user-input" rows="1" placeholder="メッセージを入力... (Enterで送信)"></textarea>
            <button id="send-btn">送信</button>
        </div>
    </div>

    <script>
        // 💡 GASのウェブアプリURL（末尾の不要な文字列を削除しました）
        const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzoSkymL_rKRt2gAW8wUylYoSMfXhvYFkw6Liw5yQoDatEXoDGv15mB5qZL-Kmkrj1g/exec';

        // 💡 セッションストレージからトークンを取得。無ければログイン画面へ強制送還
        const oauthToken = sessionStorage.getItem('oauth_token');
        if (!oauthToken) {
            window.location.href = 'login.html';
        }

        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        let chatHistory = [];

        function appendMessage(sender, text) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            msgDiv.textContent = text;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function handleSend() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage('user', text);
            userInput.value = '';
            userInput.style.height = 'auto';

            chatHistory.push({ role: "user", parts: [{ text: text }] });

            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message bot';
            loadingDiv.textContent = '思考中...';
            chatContainer.appendChild(loadingDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const response = await fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'text/plain',
                        'Authorization': 'Bearer ' + oauthToken // 💡 ログイン時に取得したトークンを付与
                    },
                    body: JSON.stringify({ contents: chatHistory })
                });

                const data = await response.json();
                chatContainer.removeChild(loadingDiv);

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const reply = data.candidates[0].content.parts[0].text;
                    appendMessage('bot', reply);
                    chatHistory.push({ role: "model", parts: [{ text: reply }] });
                } else {
                    appendMessage('bot', 'エラー: レスポンスの解析に失敗しました。\n' + JSON.stringify(data));
                    chatHistory.pop();
                }
            } catch (err) {
                chatContainer.removeChild(loadingDiv);
                appendMessage('bot', '通信エラーが発生しました: ' + err.message);
                chatHistory.pop();
            }
        }

        // ログアウト処理
        document.getElementById('logout-btn').addEventListener('click', () => {
            sessionStorage.removeItem('oauth_token');
            window.location.href = 'login.html';
        });

        sendBtn.addEventListener('click', handleSend);
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); }
        });
        userInput.addEventListener('input', function() {
            this.style.height = 'auto'; this.style.height = (this.scrollHeight) + 'px';
        });
    </script>
</body>
</html>
