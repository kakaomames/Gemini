<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Web Chat</title>
    <!-- 指定のロゴとメタタグ -->
    <link rel="icon" href="https://kakaomames.github.io/rei/logo.png">
    <meta name="description" content="GitHub Pagesで動く軽量Geminiチャットクライアント">
    <meta name="theme-color" content="#1a73e8">
    <style>
        :root {
            --bg-color: #131314;
            --chat-bg: #1e1f20;
            --text-color: #e3e3e3;
            --accent-color: #8ab4f8;
            --user-bubble: #004a77;
            --bot-bubble: #2d2e30;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            padding: 16px;
            background-color: var(--chat-bg);
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 {
            margin: 0;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        header img {
            width: 24px;
            height: 24px;
        }
        .settings {
            display: flex;
            gap: 8px;
        }
        .settings input {
            background: #2a2b2c;
            border: 1px solid #444;
            color: white;
            padding: 6px 10px;
            border-radius: 4px;
        }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            box-sizing: border-box;
        }
        .message {
            padding: 12px 16px;
            border-radius: 12px;
            max-width: 80%;
            line-height: 1.5;
            word-break: break-word;
            white-space: pre-wrap;
        }
        .message.user {
            background-color: var(--user-bubble);
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .message.bot {
            background-color: var(--bot-bubble);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid #3c4043;
        }
        .input-container {
            padding: 16px;
            background-color: var(--chat-bg);
            border-top: 1px solid #333;
            display: flex;
            justify-content: center;
        }
        .input-box {
            display: flex;
            max-width: 800px;
            width: 100%;
            background: #2a2b2c;
            border-radius: 24px;
            padding: 8px 16px;
            border: 1px solid #444;
        }
        .input-box textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            resize: none;
            outline: none;
            font-size: 1rem;
            max-height: 150px;
            padding: 6px 0;
        }
        .input-box button {
            background: var(--accent-color);
            border: none;
            color: #000;
            font-weight: bold;
            padding: 6px 16px;
            border-radius: 16px;
            cursor: pointer;
            align-self: flex-end;
        }
        .input-box button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <header>
        <h1><img src="https://kakaomames.github.io/rei/logo.png" alt="Logo"> Gemini Web Client</h1>
        <div class="settings">
            <input type="password" id="api-key" placeholder="Gemini API Key を入力" />
        </div>
    </header>

    <div id="chat-container">
        <div class="message bot">こんにちは！APIキーを入力してメッセージを送信してください。</div>
    </div>

    <div class="input-container">
        <div class="input-box">
            <textarea id="user-input" rows="1" placeholder="メッセージを入力... (Enterで送信)"></textarea>
            <button id="send-btn">送信</button>
        </div>
    </div>

    <script>
        const apiKeyInput = document.getElementById('api-key');
const chatContainer = document.getElementById('chat-container');
const userInput = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');

// --- 💡 追加：会話の履歴（コンテキスト）を保持する配列 ---
let chatHistory = [];

if(localStorage.getItem('gemini_api_key')) {
    apiKeyInput.value = localStorage.getItem('gemini_api_key');
}
apiKeyInput.addEventListener('input', () => {
    localStorage.setItem('gemini_api_key', apiKeyInput.value.trim());
});

function appendMessage(sender, text) {
    const msgDiv = document.createElement('div');
    msgDiv.className = `message ${sender}`;
    msgDiv.textContent = text;
    chatContainer.appendChild(msgDiv);
    chatContainer.scrollTop = chatContainer.scrollHeight;
    console.log(`[missionLog] ACTION: メッセージ描画完了 (${sender})`);
}

async function handleSend() {
    const text = userInput.value.trim();
    const apiKey = apiKeyInput.value.trim();
    if (!text) return;
    if (!apiKey) {
        alert('APIキーを入力してください！');
        return;
    }

    appendMessage('user', text);
    userInput.value = '';
    userInput.style.height = 'auto';

    // --- 💡 修正：ユーザーの入力を履歴に追加 ---
    chatHistory.push({
        role: "user",
        parts: [{ text: text }]
    });

    const loadingDiv = document.createElement('div');
    loadingDiv.className = 'message bot';
    loadingDiv.textContent = '思考中...';
    chatContainer.appendChild(loadingDiv);
    chatContainer.scrollTop = chatContainer.scrollHeight;

    try {
        const response = await fetch(`https://googleapis.com{apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            // --- 💡 修正：単発のテキストではなく、履歴（配列）をそのまま渡す ---
            body: JSON.stringify({
                contents: chatHistory
            })
        });

        const data = await response.json();
        chatContainer.removeChild(loadingDiv);

        if (data.candidates && data.candidates[0].content.parts[0].text) {
            const reply = data.candidates[0].content.parts[0].text;
            appendMessage('bot', reply);

            // --- 💡 追加：モデル（AI）の返答も履歴に追加 ---
            chatHistory.push({
                role: "model",
                parts: [{ text: reply }]
            });

        } else {
            appendMessage('bot', 'エラー: レスポンスの解析に失敗しました。\n' + JSON.stringify(data));
            chatHistory.pop(); // エラー時は直前のユーザー発言を履歴から削除して整合性を保つ
        }
    } catch (err) {
        chatContainer.removeChild(loadingDiv);
        appendMessage('bot', '通信エラーが発生しました: ' + err.message);
        chatHistory.pop(); // エラー時は直前のユーザー発言を履歴から削除
    }
}

// （以下、イベントリスナーの登録と自動伸縮のコードは元のままでOKです）
sendBtn.addEventListener('click', handleSend);
userInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleSend();
    }
});

userInput.addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = (this.scrollHeight) + 'px';
});

    </script>
</body>
</html>
